  if(haptics) haptics.addEventListener('change', () => { update(db => { db.profile.haptics = haptics.checked; }); });
  if(inGoal) inGoal.addEventListener('change', () => { update(db => { db.profile.workoutCountInGoal = inGoal.checked; }); render(true); });
}
function changeWorkoutSetting(kind, delta){
  const P = DB.profile;
  if(kind === 'count'){
    const v = Math.max(0, Math.min(7, (P.workoutsPerWeek|0) + delta));
    update(db => { db.profile.workoutsPerWeek = v; });
  } else {
    const v = Math.max(15, Math.min(240, (P.workoutMin|0) + delta));
    update(db => { db.profile.workoutMin = v; });
  }
  render(true);
}
async function editProfile(){
  const P = DB.profile;
  const content = `
    ${field('Имя', {id:'pf-name', value:P.name, placeholder:'Как к вам обращаться'})}
    <div class="sex" id="pf-sex">
      <button data-sex="m" class="${P.sex === 'm' ? 'on' : ''}">Мужской</button>
      <button data-sex="f" class="${P.sex === 'f' ? 'on' : ''}">Женский</button>
    </div>
    <div class="grid3">${field('Возраст', {id:'pf-age', value:P.age || '', mode:'numeric'})}
      ${field('Рост, см', {id:'pf-h', value:P.heightCm || '', mode:'numeric'})}
      ${field('Вес, кг', {id:'pf-w', value:P.weightKg || '', mode:'decimal'})}</div>
    <label class="field"><span>Активность</span><select class="input" id="pf-act">
      ${ACTIVITIES.map(a => `<option value="${a.v}"${Math.abs((P.activity||0)-a.v) < 0.01 ? ' selected' : ''}>${a.name}</option>`).join('')}
    </select></label>
    <div class="inl" style="margin-top:10px">${button('Рассчитать цели', {kind:'soft', attrs:'id="pf-calc"'})}</div>
    <div id="pf-result" style="margin-top:10px"></div>`;
  let calcRes = null;
  await openModal({
    title:'Профиль', content,
    onOpen: ov => {
      ov.querySelectorAll('#pf-sex button').forEach(b => b.addEventListener('click', () => {
        ov.querySelectorAll('#pf-sex button').forEach(x => x.classList.toggle('on', x === b));
      }));
      $id(ov, 'pf-calc').addEventListener('click', () => {
        const weight = num($id(ov, 'pf-w').value), height = num($id(ov, 'pf-h').value), age = num($id(ov, 'pf-age').value);
        const act = parseFloat($id(ov, 'pf-act').value);
        if(!weight || !height || !age){ toast('Заполните вес, рост и возраст'); return; }
        const sex = ov.querySelector('#pf-sex button.on')?.dataset.sex || '';
        const p = {weightKg:weight, heightCm:height, age, sex, activity:act};
        const g = DB.goal;
        const r = calcTargets(p, g.type === 'maintain' ? {type:'maintain', targetKg:weight, targetDate:''} : g, null);
        calcRes = {p, r};
        const fmtR = (n, u = '') => (Math.round(n) + ' ' + u).trim();
        $id(ov, 'pf-result').innerHTML = `<div class="tgt">
          <div class="row2"><span>BMR</span><b>${fmtR(r.bmr)} ${eU()}</b></div>
          <div class="row2"><span>TDEE</span><b>${fmtR(r.tdee)} ${eU()}</b></div>
          <div class="row2"><span>Цель</span><b>${fmtR(r.kcal)} ${eU()}</b></div>
          <div class="row2"><span>Белки / жиры / углеводы</span><b>${fmtR(r.protein)} / ${fmtR(r.fat)} / ${fmtR(r.carb)} г</b></div>
          <div class="row2"><span>Вода</span><b>${wV(r.water)} ${wU()}</b></div>
          ${r.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join('')}
        </div>`;
      });
    },
    buttons:[{text:'Отмена', kind:'ghost', value:false},
      {text:'Сохранить', kind:'primary', value:'ok', onClick: ov => {
        const name = $id(ov, 'pf-name').value.trim();
        const sex = ov.querySelector('#pf-sex button.on')?.dataset.sex || '';
        const age = num($id(ov, 'pf-age').value);
        const h = num($id(ov, 'pf-h').value);
        const w = num($id(ov, 'pf-w').value);
        const act = parseFloat($id(ov, 'pf-act').value);
        update(db => {
          db.profile.name = name; db.profile.sex = sex;
          db.profile.age = age || null;
          db.profile.heightCm = h || null;
          db.profile.weightKg = w || null;
          db.profile.activity = act;
          if(calcRes){
            const r = calcRes.r;
            db.targets.kcal = r.kcal;
            db.targets.protein = r.protein;
            db.targets.fat = r.fat;
            db.targets.carb = r.carb;
            db.targets.waterGoal = r.water;
            db.targets.source = 'auto';
            db.targets.calcDate = dateKey();
          }
        });
        toast('Профиль сохранён'); render(true);
      }}
    ]
  });
}

/* ============ ЭКСПОРТ / СБРОС ============ */
function exportData(){
  try{
    const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `nutrition-backup-${dateKey()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    update(db => { db.profile.lastBackup = Date.now(); });
    toast('Экспорт готов');
  }catch(e){ toast('Не удалось экспортировать'); }
}
async function importData(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    try{
      const text = await f.text();
      const raw = JSON.parse(text);
      if(!isObj(raw)) throw new Error('bad');
      const d = normalize(raw);
      DB = d; saveData();
      toast('Данные импортированы'); render(true);
    }catch(e){ toast('Некорректный файл'); }
  });
  inp.click();
}
async function resetAll(){
  if(!await confirmDialog('Сбросить все данные? Это необратимо.', {title:'Сброс', ok:'Сбросить'})) return;
  DB = emptyData(); saveData(); toast('Все данные сброшены'); render(true);
}

/* ============ РОУТЕР ============ */
let currentScreen = 'home';
let screenHistory = [];
const APP = document.getElementById('app');
function render(soft = false){
  try{
    const fn = SCREENS[currentScreen] || SCREENS.home;
    const html = fn.render();
    APP.innerHTML = html;
    bindScreen();
    if(!soft) window.scrollTo(0, 0);
    animateRings(APP);
    if(currentScreen === 'profile') profileToggle();
    if(currentScreen === 'foods'){
      const q = document.getElementById('food-q');
      if(q) q.addEventListener('input', () => {
        const l = document.getElementById('foodlist'); if(l) l.innerHTML = foodListHTML(q.value, false);
        bindSwipes(APP);
      });
    }
  }catch(err){
    console.error(err);
    APP.innerHTML = `<div class="card"><h2 class="card-title">Что-то пошло не так</h2>
      <p class="muted">Попробуйте перезагрузить страницу. Ошибка: ${esc(String(err && err.message || err))}</p>
      <div style="margin-top:12px">${button('Сбросить экран', {kind:'ghost', block:true, attrs:'onclick="location.reload()"'})}</div>
    </div>`;
  }
}

function bindScreen(){
  bindSwipes(APP);
  APP.querySelectorAll('[data-cal]').forEach(b => b.addEventListener('click', () => {
    viewDate = b.dataset.cal;
    const det = document.getElementById('cal-detail'); if(det) det.innerHTML = calDetail(viewDate);
    APP.querySelectorAll('[data-cal]').forEach(x => x.classList.toggle('sel', x === b));
  }));
  APP.querySelectorAll('[data-cal-nav]').forEach(b => b.addEventListener('click', () => {
    calMonth.setMonth(calMonth.getMonth() + Number(b.dataset.calNav)); render(true);
  }));
  APP.querySelectorAll('input[data-wk]').forEach(inp => {
    inp.addEventListener('change', () => toggleWorkout(Number(inp.dataset.wk), inp.checked));
  });
  const dbFile = document.getElementById('db-file');
  if(dbFile){
    dbFile.addEventListener('change', async () => {
      const f = dbFile.files && dbFile.files[0]; if(!f) return;
      try{ await importFoodsFile(f); }catch(e){ toast(e.message || 'Ошибка импорта'); }
      updateFoodsStatus();
    });
  }
  updateFoodsStatus();
}

function go(screen){
  if(screen === currentScreen && screen === 'home'){ render(); return; }
  if(currentScreen !== screen){
    screenHistory.push(currentScreen);
    if(screenHistory.length > 20) screenHistory.shift();
  }
  currentScreen = screen;
  render();
}

function goBack(){
  if(screenHistory.length){
    const prev = screenHistory.pop();
    currentScreen = prev;
    render();
  } else {
    currentScreen = 'home';
    render();
  }
}

/* Делегированные действия */
document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]');
  if(goEl){ go(goEl.dataset.go); return; }
  const actEl = e.target.closest('[data-act]');
  if(!actEl) return;
  const act = actEl.dataset.act;
  if(act === 'back'){
    goBack();
  } else if(act === 'day'){
    viewDate = shiftKey(viewDate, Number(actEl.dataset.d)); render();
  } else if(act === 'today'){
    viewDate = dateKey(); render();
  } else if(act === 'add'){
    entryForm(null, actEl.dataset.meal || undefined);
  } else if(act === 'edit-entry'){
    entryForm(actEl.dataset.id);
  } else if(act === 'del-entry'){
    delEntry(actEl.dataset.id);
  } else if(act === 'new-food'){
    editFood().then(() => render(true));
  } else if(act === 'edit-food'){
    editFood(actEl.dataset.id).then(() => render(true));
  } else if(act === 'del-food'){
    delFood(actEl.dataset.id);
  } else if(act === 'detail'){
    detail(actEl.dataset.k);
  } else if(act === 'w-add'){
    addWater(Number(actEl.dataset.ml));
  } else if(act === 'w-manual'){
    const inp = document.getElementById('w-manual');
    addWater(inp ? toMl(num(inp.value)) : 0);
  } else if(act === 'w-undo'){
    undoWater();
  } else if(act === 'w-goal'){
    editGoal('waterGoal');
  } else if(act === 's-goal'){
    editGoal('stepsGoal');
  } else if(act === 's-save'){
    saveSteps(); render(true);
  } else if(act === 's-reset'){
    update(db => { delete db.steps[dateKey()]; }); toast('Шаги сброшены'); render(true);
  } else if(act === 'edit-goal'){
    editGoal(actEl.dataset.key);
  } else if(act === 'pr-edit'){
    editProfile();
  } else if(act === 'pr-wk-count'){
    changeWorkoutSetting('count', Number(actEl.dataset.d));
  } else if(act === 'pr-wk-min'){
    changeWorkoutSetting('min', Number(actEl.dataset.d));
  } else if(act === 'scn-new'){
    scenarioForm();
  } else if(act === 'scn-edit'){
    scenarioForm(actEl.dataset.id);
  } else if(act === 'scn-add'){
    applyScenario(actEl.dataset.id);
  } else if(act === 'freq-add'){
    quickAddFrequent(actEl.dataset.kind, actEl.dataset.id);
  } else if(act === 'freq-pin'){
    e.stopPropagation();
    togglePin(actEl.dataset.name);
    render(true);
  } else if(act === 'freq-all'){
    const add = document.querySelector('[data-act="add"]');
    if(add) add.scrollIntoView({behavior:'smooth', block:'center'});
  } else if(act === 'onboard'){
    go('profile');
  } else if(act === 'open-day'){
    viewDate = actEl.dataset.date; currentScreen = 'diary'; render();
  } else if(act === 'db-import'){
    const inp = document.getElementById('db-file'); if(inp) inp.click();
  } else if(act === 'db-clear'){
    (async () => { if(await confirmDialog('Очистить базу продуктов?', {title:'Очистка базы'})){ await clearFoodsDB(); render(true); } })();
  } else if(act === 'go-profile'){
    go('profile');
  }
});

async function quickAddFrequent(kind, id){
  const ref = kind === 'db' ? FOODS_DB.find(f => f.id === id) : DB.foods.find(f => f.id === id);
  if(!ref) return;
  const u = ref.units && ref.units.length ? ref.units[0] : null;
  const grams = u ? u.grams : 100;
  const qty = u ? 1 : 100;
  const label = u ? u.label : 'г';
  const kcal = ref.per100.kcal * grams / 100;
  const now = new Date();
  const entry = {id:uid(), meal:guessMeal(now.getHours()), name:ref.name, grams:r1(grams),
    kcal:r1(kcal), p:r1(ref.per100.p*grams/100), f:r1(ref.per100.f*grams/100), c:r1(ref.per100.c*grams/100),
    time:`${pad(now.getHours())}:${pad(now.getMinutes())}`, qty, unitLabel:u ? label : ''};
  update(db => { const k = dateKey(); const l = db.entries[k] || (db.entries[k] = []); l.push(entry); });
  toast(`Добавлено: ${esc(ref.name)}`, { label:'Отменить', fn:() => {
    update(db => { const k = dateKey(); db.entries[k] = (db.entries[k] || []).filter(x => x.id !== entry.id); if(!db.entries[k].length) delete db.entries[k]; });
    toast('Отменено'); render(true);
  }});
  render(true);
}

(async () => {
  try{ await loadFoodsFromIDB(); }catch(e){}
  try{ ensureMealsSeeded(); }catch(e){}
  render();
})();
